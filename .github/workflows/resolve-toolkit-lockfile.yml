name: Resolve toolkit lockfile
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/feat/teacher-tools-images-pdf-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve reproducible dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already matches"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: synchronize teacher toolkit lockfile [skip ci]'
          git fetch origin feat/teacher-tools-images-pdf-20261009
          git rebase origin/feat/teacher-tools-images-pdf-20261009
          git push origin HEAD:feat/teacher-tools-images-pdf-20261009
